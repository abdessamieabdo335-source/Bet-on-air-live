<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exacta PRO + Logo</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}h1{color:#00ff88}.box{background:#1a1a1a;border:2px solid #00ff88;border-radius:15px;padding:20px;max-width:420px;margin:auto}input{width:90%;padding:12px;margin:8px;border-radius:8px;border:none}button{background:#00ff88;color:#000;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:18px;width:100%;cursor:pointer;margin-top:10px}.res{background:#000;border:1px solid #333;margin-top:15px;padding:15px;border-radius:10px;color:#00ff88}.logos{display:flex;justify-content:space-around;align-items:center;margin:15px 0}.logos img{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}.wa{background:#25D366;color:#fff}</style></head><body>
<h1>⚽ EXACTA PRO</h1><p>مع لوغو الفريق تلقائيا</p>
<div class="box">
<input id="h" placeholder="Real Madrid" value="Real Madrid">
<input id="a" placeholder="Barcelona" value="Barcelona">
<button onclick="pred()">🔮 توقع + جيب اللوغو</button>
<div class="logos"><div><img id="lh" src="https://via.placeholder.com/70"><br><span id="nh">HOME</span></div><div>VS</div><div><img id="la" src="https://via.placeholder.com/70"><br><span id="na">AWAY</span></div></div>
<div id="r" class="res">النتيجة هنا...</div>
<button class="wa" onclick="window.open('https://wa.me/212600000000','_blank')">💬 واتساب 50DH</button>
</div>
<script>
async function getLogo(team,imgId){try{let r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(team)}`);let d=await r.json();if(d.teams&&d.teams[0].strTeamBadge){document.getElementById(imgId).src=d.teams[0].strTeamBadge;return;}}catch(e){}document.getElementById(imgId).src=`https://via.placeholder.com/70?text=${team[0]}`;}
const P={'1/1':['2-0','2-1'],'2/2':['0-2','1-2'],'X/X':['1-1','0-0'],'X/1':['2-1'],'X/2':['0-1']};
async function pred(){let h=document.getElementById('h').value||'Real';let a=document.getElementById('a').value||'Barca';document.getElementById('nh').innerText=h;document.getElementById('na').innerText=a;getLogo(h,'lh');getLogo(a,'la');let k=Object.keys(P)[Math.floor(Math.random()*5)];let s=P[k][Math.floor(Math.random()*P[k].length)];document.getElementById('r').innerHTML=`HT/FT: <b style='color:yellow'>${k}</b><br>النتيجة: <b style='font-size:32px'>${s}</b>`;}
pred();
</script></body></html>
