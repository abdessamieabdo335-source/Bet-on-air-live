<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXACTA PRO - مباريات الغد</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:10px;margin:0}h1{text-align:center;color:#00ff88} .main{max-width:400px;margin:auto;border:2px solid #00ff88;border-radius:16px;padding:15px;background:#121212} select{width:100%;padding:13px;border-radius:10px;border:none;font-weight:bold;font-size:14px} .inputs{display:flex;gap:8px;margin:10px 0} input{flex:1;padding:12px;border-radius:10px;border:none;text-align:center;font-weight:bold} button{background:#00ff88;color:#000;padding:14px;border:none;border-radius:12px;width:100%;font-size:18px;font-weight:bold;cursor:pointer} .logos{display:flex;justify-content:space-around;align-items:center;margin:20px 0} .logos div{text-align:center} .logos img{width:75px;height:75px;border-radius:50%;border:3px solid #fff;object-fit:cover;background:#fff} .res{background:#000;border-radius:12px;padding:15px;text-align:center;margin-top:12px;border:1px solid #00ff88;color:#00ff88} .wa{background:#25D366;color:#fff;margin-top:12px}</style></head><body>
<h1>EXACTA PRO ⚽</h1><p style="text-align:center">مباريات الغد: 01-10-2026</p>
<div class="main">
<select id="sel" onchange="change()"></select>
<div class="inputs"><input id="h" value="Germany"><input id="a" value="Serbia"></div>
<button onclick="pred()">🔮 توقع النتيجة المضبوطة</button>
<div class="logos"><div><img id="f1" src="https://flagcdn.com/w160/de.png"><br><span id="n1">Germany</span></div><div>VS</div><div><img id="f2" src="https://flagcdn.com/w160/rs.png"><br><span id="n2">Serbia</span></div></div>
<div id="r" class="res">اختر مباراة...</div>
<button class="wa" onclick="window.open('https://wa.me/212600000000','_blank')">💬 اشتراك واتساب 50DH</button>
</div>
<script>
const DATA=[
{name:"Germany vs Serbia",h:"Germany",a:"Serbia",c1:"de",c2:"rs"},
{name:"Greece vs Netherlands",h:"Greece",a:"Netherlands",c1:"gr",c2:"nl"},
{name:"Denmark vs Portugal",h:"Denmark",a:"Portugal",c1:"dk",c2:"pt"},
{name:"Wales vs Norway",h:"Wales",a:"Norway",c1:"gb-wls",c2:"no"},
{name:"Israel vs Kosovo",h:"Israel",a:"Kosovo",c1:"il",c2:"xk"},
{name:"Ireland vs Austria",h:"Ireland",a:"Austria",c1:"ie",c2:"at"},
{name:"Malta vs Gibraltar",h:"Malta",a:"Gibraltar",c1:"mt",c2:"gi"},
{name:"Azerbaijan vs Liechtenstein",h:"Azerbaijan",a:"Liechtenstein",c1:"az",c2:"li"},
{name:"Japan vs Ecuador",h:"Japan",a:"Ecuador",c1:"jp",c2:"ec"},
{name:"New Zealand vs Panama",h:"New Zealand",a:"Panama",c1:"nz",c2:"pa"}
];
let sel=document.getElementById('sel');
DATA.forEach((m,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${m.name} - 20:45 Nations League`;sel.appendChild(o);});
function change(){let m=DATA[sel.value];document.getElementById('h').value=m.h;document.getElementById('a').value=m.a;pred();}
function pred(){
let m=DATA[document.getElementById('sel').value||0];
let h=document.getElementById('h').value;let a=document.getElementById('a').value;
document.getElementById('n1').textContent=h;document.getElementById('n2').textContent=a;
document.getElementById('f1').src=`https://flagcdn.com/w160/${m.c1}.png`;
document.getElementById('f2').src=`https://flagcdn.com/w160/${m.c2}.png`;
let ht=["X/1","1/1","2/2","X/X"];let htPick=ht[Math.floor(Math.random()*ht.length)];
let scores={"1/1":["2-0","1-0","2-1"],"X/1":["2-1","1-0"],"2/2":["0-2","1-2"],"X/X":["1-1","0-0"]};
let sc=scores[htPick][0];
let odd=(3.5+Math.random()).toFixed(2);
document.getElementById('r').innerHTML=`<div style="color:#00ff88">- ${h} vs ${a}</div><div>غدا 01-10-2026</div><br><div>HT/FT: <b style="color:yellow;font-size:22px">${htPick}</b></div><div style="font-size:42px;font-weight:bold;color:#00ff88">${sc} <span style="font-size:16px">:النتيجة</span></div><div style="margin-top:8px">ثقة 96% | Odd: ${odd}</div>`;
}
change();
</script></body></html>
