<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exacta API</title></head><body style="background:#000;color:#0f0;font-family:monospace;padding:20px"><h2>✅ Exacta Backend ON</h2><div id="out"></div><script>const PREDS={'1/1':{s:['2-0','2-1'],w:'HOME'},'2/2':{s:['0-2','1-2'],w:'AWAY'},'X/X':{s:['1-1','0-0'],w:'DRAW'},'X/1':{s:['2-1'],w:'HOME'},'X/2':{s:['0-1'],w:'AWAY'},'1/2':{s:['1-2'],w:'AWAY'}};function getPred(h='HOME',a='AWAY'){let k=Object.keys(PREDS)[Math.floor(Math.random()*6)];let p=PREDS[k];let fs=p.s[Math.floor(Math.random()*p.s.length)];return{match:h+' vs '+a,htft:k,final_score:fs,winner:p.w,odd:(2+Math.random()*2).toFixed(2)}}const p=new URLSearchParams(location.search);if(p.get('api')==='predict'){let h=p.get('home')||'Real';let a=p.get('away')||'Barca';document.getElementById('out').innerHTML='<pre>'+JSON.stringify(getPred(h,a),null,2)+'</pre>';}else{let all=[];for(let i=0;i<5;i++)all.push(getPred('Team'+i,'Team'+(i+1)));document.getElementById('out').innerHTML='<pre>'+JSON.stringify(all,null,2)+'</pre>';}</script></body></html>
